dataset_name: phase3g_kcap_g1_normalization_calibration
scope: diagnostic_normalization_calibration_only
interpretation: no_model_evidence

inputs:
  kcap_raw_cl_dir: ${FDS_G1_DATA_ROOT}/../external/Predictions/kcap_xi/outputs/test_output_S8_fid_test/shear_cl/
  kcap_bandpower_dir: ${FDS_G1_DATA_ROOT}/../external/Predictions/iterated_cov_MAP_BlindC/bandpower_shear_e/
  g1_bandpower_predictions: ${FDS_G1_DATA_ROOT}/../outputs/bandpower_peeE_model_smoke/
  row_order: ${FDS_G1_DATA_ROOT}/../data/peeE_subset/bandpower_PeeE_row_order_verified.csv
  g1_stage_config: ${FDS_G1_DATA_ROOT}/stage3_kids1000_xipm_270_config_cuts_mdz_ia.yaml

projection:
  ell_min: 100
  ell_max: 1500
  n_bins: 8
  valid_ell_range: [2.0, 5000.0]
  variants:
    - name: bin_center
      description: Bin center sample of ℓ²Cℓ/(2π)
      formula: bin_center_sample
    - name: mean_linear_ell
      description: Arithmetic mean of ℓ²Cℓ/(2π) over linear ℓ range
      formula: mean_linear
    - name: mean_log_ell
      description: Mean of ℓ²Cℓ/(2π) over log ℓ range
      formula: mean_log
    - name: integrate_dell
      description: Integrate ℓ²Cℓ/(2π) over dℓ, normalize by Δℓ
      formula: integrate_dell
    - name: integrate_dlnell
      description: Integrate ℓ²Cℓ/(2π) over dlnℓ, normalize by Δlnℓ
      formula: integrate_dlnell
    - name: ell_ellplus1
      description: Integrate ℓ(ℓ+1)Cℓ/(2π) over dℓ, normalize by Δℓ
      formula: ell_ellplus1
    - name: no_2pi_factor
      description: Integrate ℓ²Cℓ (omit 1/(2π) factor) over dℓ, normalize by Δℓ
      formula: no_2pi_factor

checks:
  compare_parameters: true
  compare_nz_normalization: true
  compare_lensing_kernel: true
  compare_shear_m: true

outputs:
  outdir: ${FDS_G1_DATA_ROOT}/../outputs/phase3g_normalization
