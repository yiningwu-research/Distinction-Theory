# Stage 4B-2: EE+nE BandPower Minimal Local Refit Config
# All parameters follow user-specified bounds and starting values
# No full 3x2pt, no photo-z shifts, no nested sampling, only L-BFGS-B

paths:
  # Validated Phase 3 data products
  data_200: "${FDS_G1_DATA_ROOT}/../data/kids1000_bandpower_200_standard.csv"
  cov_200: "${FDS_G1_DATA_ROOT}/../data/kids1000_bandpower_covariance_200.npy"
  row_order: "${FDS_G1_DATA_ROOT}/../data/bandpower_row_order_verified.csv"
  # PeeE prediction function from Phase3 bandpower_peeE_model_smoke
  peeE_pred_path: "${FDS_G1_DATA_ROOT}/../outputs/bandpower_peeE_model_smoke/"
  # PneE prediction function from Phase3i_pneE
  pneE_pred_path: "${FDS_G1_DATA_ROOT}/../outputs/phase3i_pneE/"
  output_dir: "${FDS_G1_REPO_ROOT}/phase4_kids_3x2pt_full/outputs/phase4b_eenE_refit/"

bounds:
  Omega_m: [0.15, 0.45]
  sigma8: [0.3, 1.3]
  s: [1.0, 3.0]
  kappa: [0.0, 1.5]
  A_IA: [-5.0, 5.0]
  m_src0: [-0.1, 0.1]
  m_src1: [-0.1, 0.1]
  m_src2: [-0.1, 0.1]
  m_src3: [-0.1, 0.1]
  m_src4: [-0.1, 0.1]
  b_lens0: [0.2, 5.0]
  b_lens1: [0.2, 5.0]

starting_values:
  # Fallback values, no warmstart JSON found per user check
  common:
    Omega_m: 0.315
    sigma8: 0.811
    A_IA: 1.0
    m_src0: 0.012
    m_src1: 0.012
    m_src2: 0.012
    m_src3: 0.012
    m_src4: 0.012
  per_model:
    lcdm:
      b_lens0: 0.85
      b_lens1: 0.93
    m34:
      s: 2.0
      b_lens0: 0.89
      b_lens1: 0.98
    mkappa:
      s: 2.0
      kappa: 0.75
      b_lens0: 0.99
      b_lens1: 1.10

execution:
  optimizer: L-BFGS-B
  max_iter: 1000
  ftol: 1e-6
  gtol: 1e-6
  run_order:
    - lcdm
    - m34
    - mkappa
  use_full_covariance: true
  include_ee_pnee_cross: true
  # No photo-z shifts, no DE, no nested sampling
