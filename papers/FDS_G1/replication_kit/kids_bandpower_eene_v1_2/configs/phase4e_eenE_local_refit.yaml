
dataset_name: phase4e_eenE_adversarial_refit
scope: EE+nE BandPower adversarial refit
interpretation: diagnostic only, not evidence, not full 3×2pt

fixed_params:
  h: 0.68
  Omega_b: 0.049
  n_s: 0.9665

paths:
  output_dir: ${FDS_G1_REPO_ROOT}/phase4_kids_3x2pt_full/outputs/phase4e_adversarial_controls
  stage3_config: ${FDS_G1_DATA_ROOT}/stage3_kids1000_xipm_270_config_cuts_mdz_ia.yaml
  data_200: ${FDS_G1_DATA_ROOT}/../data/kids1000_bandpower_200_standard.csv
  cov_200: ${FDS_G1_DATA_ROOT}/../data/kids1000_bandpower_covariance_200.npy
  pneE_row_order: ${FDS_G1_DATA_ROOT}/../outputs/phase3i_pneE/g1_pneE_smoke_predictions.csv
  peeE_row_order: ${FDS_G1_DATA_ROOT}/../outputs/bandpower_peeE_model_smoke/lcdm_peeE_prediction.csv

bounds:
  Omega_m: [0.15, 0.45]
  sigma8: [0.3, 1.3]
  s: [1.0, 3.0]
  kappa: [0.0, 1.5]
  Sigma0: [-0.95, 1.0]
  Sigma_bin0: [-0.95, 1.0]
  Sigma_bin1: [-0.95, 1.0]
  A_IA: [-10.0, 10.0]
  m_src0: [-0.2, 0.2]
  m_src1: [-0.2, 0.2]
  m_src2: [-0.2, 0.2]
  m_src3: [-0.2, 0.2]
  m_src4: [-0.2, 0.2]
  b_lens0: [0.05, 10.0]
  b_lens1: [0.05, 10.0]

starting_values:
  common:
    A_IA: -0.13
    m_src0: -0.007
    m_src1: 0.001
    m_src2: -0.038
    m_src3: -0.022
    m_src4: 0.024
    b_lens0: 1.2
    b_lens1: 1.4
  per_model:
    lcdm:
      Omega_m: 0.394
      sigma8: 0.509
    m34:
      Omega_m: 0.31
      sigma8: 0.82
      s: 2.2
    mkappa:
      Omega_m: 0.31
      sigma8: 0.82
      s: 2.2
      kappa: 0.7
    constsigma:
      Omega_m: 0.31
      sigma8: 0.82
      Sigma0: 0.0
    binsigma2:
      Omega_m: 0.31
      sigma8: 0.82
      Sigma_bin0: 0.0
      Sigma_bin1: 0.0

models:
  lcdm:
    internal_name: lcdm
    param_names: ["Omega_m", "sigma8", "A_IA", "m_src0", "m_src1", "m_src2", "m_src3", "m_src4", "b_lens0", "b_lens1"]
  m34:
    internal_name: m34
    param_names: ["Omega_m", "sigma8", "s", "A_IA", "m_src0", "m_src1", "m_src2", "m_src3", "m_src4", "b_lens0", "b_lens1"]
  mkappa:
    internal_name: mkappa
    param_names: ["Omega_m", "sigma8", "s", "kappa", "A_IA", "m_src0", "m_src1", "m_src2", "m_src3", "m_src4", "b_lens0", "b_lens1"]
  constsigma:
    internal_name: const_sigma
    param_names: ["Omega_m", "sigma8", "Sigma0", "A_IA", "m_src0", "m_src1", "m_src2", "m_src3", "m_src4", "b_lens0", "b_lens1"]
  binsigma2:
    internal_name: binned_sigma
    param_names: ["Omega_m", "sigma8", "Sigma_bin0", "Sigma_bin1", "A_IA", "m_src0", "m_src1", "m_src2", "m_src3", "m_src4", "b_lens0", "b_lens1"]

execution:
  run_order: ["lcdm", "m34", "mkappa", "constsigma", "binsigma2"]
  max_iter: 200
  ftol: 1e-7
  gtol: 1e-7
