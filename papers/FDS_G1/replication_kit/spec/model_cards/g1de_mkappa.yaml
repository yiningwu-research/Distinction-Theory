# G1DE-M_kappa — Free-kappa control model
# Reference: FDS-G1 Complete Series, G1fit-real section
# Control: tests whether kappa=3/4 is preferred over free kappa.

model: g1demk
description: >
  Free-kappa control for the projection-locked normal form.
  Ward-suppressed Ricci leakage (mu0=0), but kappa is sampled freely.
  If this beats M_{3/4} decisively, the exact 3/4 projection lock is demoted.
ndim: 5
nparams: 5

parameters:
  - name: Omega_m
    description: Present-day matter density parameter
    bounds: [0.05, 0.60]
    start: 0.2979
  - name: s
    description: Screen-index parameter
    bounds: [1.0, 5.0]
    start: 2.592
  - name: q_BAO
    description: BAO sound-horizon calibration parameter
    bounds: [10.0, 80.0]
    start: 30.376
  - name: sigma8_0
    description: Present-day sigma8
    bounds: [0.40, 1.20]
    start: 0.7744
  - name: kappa
    description: Weyl projection coefficient (0 = no Weyl response, 1 = maximal)
    bounds: [0.0, 2.0]
    start: 0.840

background: same as g1dem34

response:
  mu_a: "1.0"
  mu0: 0.0
  Sigma_a: "1 + Sigma0 * Xhat(a)"
  Sigma0: "-kappa * (3 - s)"

fixed_values:
  mu0: 0.0
